[project]
name = "subterra-backend"
version = "0.1.0"
description = "Subterra Clash backend"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
